name: Build and Release ISOs

# Cut a release by pushing a tag:  git tag v2.4 && git push origin v2.4
#
# Every edition is built on its own runner and uploaded straight to SourceForge
# (GitHub release assets must be under 2 GiB, and home/gaming/fallen are 5-11 GB):
#   https://sourceforge.net/projects/<SF_PROJECT>/files/<version>/
# The GitHub release then lists the download links and SHA256 sums; NetInstall fits
# under the limit, so it is attached to the release as well.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   secret   SF_SSH_KEY   private key whose public half is in SourceForge ->
#                         Account Settings -> SSH Settings
#   SF_USER      your SourceForge username (secret OR variable)
#   SF_PROJECT   the SourceForge project's unix name / URL slug (secret OR variable)
#
# Hand-dispatch builds one edition (or all) for testing; they only reach SourceForge
# when `publish` is ticked.
#
# Disk: a hosted runner has ~13 GB free on / out of the box; reclaiming the
# preinstalled SDKs brings it to ~45 GB. The build keeps the peak below that by
# dropping the pacman download cache once packages are installed, and by mkarchiso -r
# removing the unpacked rootfs before the ISO is written.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to build
        required: true
        default: all
        type: choice
        options:
          - all
          - home
          - gaming
          - fallen
          - netinstall
      publish:
        description: Upload the ISO(s) to SourceForge
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    name: Resolve editions
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.set.outputs.editions }}
      version: ${{ steps.set.outputs.version }}
      publish: ${{ steps.set.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.edition }}" != "all" ]; then
            echo 'editions=["${{ inputs.edition }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'editions=["home","gaming","fallen","netinstall"]' >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.edition }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.plan.outputs.editions) }}
    env:
      EDITION: ${{ matrix.edition }}
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      SF_USER: ${{ secrets.SF_USER || vars.SF_USER }}
      SF_PROJECT: ${{ secrets.SF_PROJECT || vars.SF_PROJECT }}
    steps:
      - name: Free disk space (reclaim preinstalled SDKs + tool cache)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Reclaim the extra runner cruft jlumbroso misses
        run: |
          sudo rm -rf \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/lib/google-cloud-sdk /usr/lib/azure-cli \
            /opt/az /opt/microsoft \
            /usr/local/graalvm \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/share/miniconda /opt/pipx \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo bash -c 'ls -d /usr/lib/jvm/* 2>/dev/null | grep -v "$(readlink -f /usr/lib/jvm/default 2>/dev/null)" | xargs -r rm -rf' || true

      - name: Show available disk space
        run: df -h /

      - uses: actions/checkout@v4

      - name: Build ${{ matrix.edition }} ISO
        run: |
          sudo mkdir -p /mnt/axbuild
          docker run --rm --privileged \
            -v "$PWD":/work -v /mnt/axbuild:/mnt/axbuild -w /work \
            -e AX_BUILD_DIR=/mnt/axbuild -e EDITION \
            archlinux:latest bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                archiso git grub syslinux libisoburn squashfs-tools \
                mtools dosfstools e2fsprogs erofs-utils
              pacman -Scc --noconfirm || true
              # Once mkarchiso has installed the packages, the ~9 GB of downloads in the
              # cache are dead weight for the rest of the build: drop them.
              ( stamp="/mnt/axbuild/${EDITION}/work/base._make_packages"
                while [ ! -e "$stamp" ]; do sleep 30; done
                rm -rf /var/cache/pacman/pkg/*
                echo "[ci] package cache dropped after install" ) &
              ./build.sh --"${EDITION}"
            '

      - name: Name and checksum the ISO
        run: |
          case "$EDITION" in
            home)       base="archangelos-home" ;;
            gaming)     base="archangelos-game-edition" ;;
            fallen)     base="archangelos-fallen" ;;
            netinstall) base="archangelos-netinstall" ;;
          esac
          asset="${base}-${VERSION}.iso"
          iso="$(sudo find /mnt/axbuild/$EDITION/out -maxdepth 1 -name '*.iso' | head -n 1)"
          test -n "${iso}"
          sudo mv "${iso}" "${asset}"
          sudo chown "$(id -u):$(id -g)" "${asset}"
          sha256sum "${asset}" > "${asset}.sha256"
          ls -lh "${asset}"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"
          echo "$(stat -c %s "${asset}")" > "${asset}.size"

      - name: Upload to SourceForge
        if: env.PUBLISH == 'true'
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          test -n "$SF_SSH_KEY" && test -n "$SF_USER" && test -n "$SF_PROJECT" || {
            echo "::error::SF_SSH_KEY secret and SF_USER / SF_PROJECT variables must be set to publish"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sf && chmod 600 ~/.ssh/sf
          # diagnostic: a malformed paste fails here with a clear message; a valid key
          # prints its fingerprint so you can compare it to the key on SourceForge.
          if ssh-keygen -y -f ~/.ssh/sf >/dev/null 2>/tmp/keyerr; then
            echo "SSH key parsed OK. Public fingerprint (must match SourceForge > Account > SSH Settings):"
            ssh-keygen -lf ~/.ssh/sf
          else
            echo "::error::SF_SSH_KEY is not a valid private key. Paste the WHOLE key file, including the"
            echo "::error::-----BEGIN...----- and -----END...----- lines and all line breaks."
            cat /tmp/keyerr; exit 1
          fi
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          dest="/home/frs/project/${SF_PROJECT}/${VERSION}"
          ssh_cmd="ssh -i $HOME/.ssh/sf -o IdentitiesOnly=yes"
          # make the version folder (an existing one is fine)
          printf -- '-mkdir %s\n' "$dest" | sftp -i ~/.ssh/sf -o IdentitiesOnly=yes -b - "${SF_USER}@frs.sourceforge.net"
          for attempt in 1 2 3 4; do
            rsync -av --partial --progress -e "$ssh_cmd" \
              "${ASSET}" "${ASSET}.sha256" "${SF_USER}@frs.sourceforge.net:${dest}/" && break
            echo "upload failed (attempt $attempt), retrying"; sleep $((attempt * 30))
          done
          rm -f ~/.ssh/sf

      # Only the tiny checksum/size files go to GitHub artifacts (a few KB) — the ISOs
      # themselves live on SourceForge, so we never touch the small free artifact quota.
      # Non-fatal: a quota hiccup must not turn a successful SourceForge upload red.
      - name: Keep the checksum for the release notes
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-release
          path: |
            ${{ env.ASSET }}.sha256
            ${{ env.ASSET }}.size
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SF_PROJECT: ${{ secrets.SF_PROJECT || vars.SF_PROJECT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rel
          merge-multiple: true

      - name: Write release notes
        run: |
          ls -lh rel
          {
            echo "## Downloads"
            echo
            echo "| Edition | ISO | Size | SHA256 |"
            echo "|---|---|---|---|"
            for f in rel/*.sha256; do
              iso="$(basename "${f%.sha256}")"
              sum="$(cut -d' ' -f1 "$f")"
              size="$(numfmt --to=iec --suffix=B "$(cat "rel/${iso}.size")")"
              url="https://sourceforge.net/projects/${SF_PROJECT}/files/${VERSION}/${iso}/download"
              echo "| ${iso%-${VERSION}.iso} | [${iso}](${url}) | ${size} | \`${sum}\` |"
            done
            echo
            echo "All ISOs are hosted on [SourceForge](https://sourceforge.net/projects/${SF_PROJECT}/files/${VERSION}/). Verify each download against its SHA256 above."
          } > notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            rel/*.sha256
          generate_release_notes: true
