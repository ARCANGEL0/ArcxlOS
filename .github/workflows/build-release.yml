name: Build and Release ISOs


on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to build
        required: true
        default: all
        type: choice
        options:
          - all
          - home
          - gaming
          - fallen
          - netinstall

permissions:
  contents: read

jobs:
  plan:
    name: Resolve editions
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.set.outputs.editions }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.edition }}" != "all" ]; then
            echo 'editions=["${{ inputs.edition }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'editions=["home","gaming","fallen","netinstall"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.edition }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.plan.outputs.editions) }}
    steps:
      - name: Free disk space (reclaim preinstalled SDKs + tool cache)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Reclaim the extra runner cruft jlumbroso misses
        run: |
          sudo rm -rf \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/lib/google-cloud-sdk /usr/lib/azure-cli \
            /opt/az /opt/microsoft \
            /usr/local/graalvm \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/share/miniconda /opt/pipx \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo bash -c 'ls -d /usr/lib/jvm/* 2>/dev/null | grep -v "$(readlink -f /usr/lib/jvm/default 2>/dev/null)" | xargs -r rm -rf' || true

      - name: Show available disk space
        run: df -h /

      - uses: actions/checkout@v4

      - name: Build ${{ matrix.edition }} ISO
        run: |
          sudo mkdir -p /mnt/axbuild
          docker run --rm --privileged \
            -v "$PWD":/work -v /mnt/axbuild:/mnt/axbuild -w /work \
            -e AX_BUILD_DIR=/mnt/axbuild \
            archlinux:latest bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                archiso git grub syslinux libisoburn squashfs-tools \
                mtools dosfstools e2fsprogs erofs-utils
              pacman -Scc --noconfirm || true
              ./build.sh --${{ matrix.edition }}
            '

      - name: Rename ISO to release asset name
        run: |
          case "${{ matrix.edition }}" in
            home)      asset="archangelos-home.iso" ;;
            gaming)    asset="archangelos-game-edition.iso" ;;
            fallen)    asset="archangelos-fallen.iso" ;;
            netinstall) asset="archangelos-netinstall.iso" ;;
          esac
          iso="$(sudo find /mnt/axbuild/${{ matrix.edition }}/out -maxdepth 1 -name '*.iso' | head -n 1)"
          test -n "${iso}"
          sudo mv "${iso}" "${asset}"
          sudo chown "$(id -u):$(id -g)" "${asset}"
          ls -lh "${asset}"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Checksum
        run: sha256sum "${{ env.ASSET }}" > "${{ env.ASSET }}.sha256"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-iso
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          retention-days: 7
          compression-level: 0

  release:
    name: Attach ISOs to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: isos
          merge-multiple: true

      - name: List collected assets
        run: ls -lh isos

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            isos/*.iso
            isos/*.sha256
          generate_release_notes: true
