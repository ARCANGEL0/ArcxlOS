# ArchangelOS system hyprlock config — mirrors the SDDM login theme so the
# lock screen looks like "the SDDM theme again" (same background, logo, accent
# #C24A52, Quantico type). hyprlock reads ~/.config/hypr/hyprlock.conf first and
# falls back to this file, so every user (live + installed) gets it for free.
# Assets are the SDDM theme's own files, shipped in the ISO.

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /usr/share/sddm/themes/archangelos/assets/background.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.7
    color = rgb(0e0e0d)
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgb(ecebe8)
    font_size = 64
    font_family = Quantico
    position = 0, 96
    halign = center
    valign = center
}

# ArchangelOS mark
image {
    monitor =
    path = /usr/share/sddm/themes/archangelos/assets/logo.png
    size = 176
    rounding = 0
    border_size = 0
    position = 0, 232
    halign = center
    valign = center
}

# Signed-in user
label {
    monitor =
    text = $USER
    color = rgb(9a9895)
    font_size = 15
    font_family = Quantico
    position = 0, 22
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true
    outer_color = rgb(c24a52)
    inner_color = rgb(1a1a19)
    font_color = rgb(ecebe8)
    fade_on_empty = false
    placeholder_text = <span foreground="##9a9895">Enter password</span>
    fail_text = <span foreground="##c24a52">$FAIL</span>
    font_family = Quantico
    position = 0, -48
    halign = center
    valign = center
}
