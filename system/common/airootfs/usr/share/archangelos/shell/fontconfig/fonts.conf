<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<dir prefix="xdg">fonts</dir>
	<dir>/usr/share/fonts/TTF</dir>
	<dir>/usr/share/fonts/OTF</dir>
	<dir>/usr/share/fonts/inter</dir>
	<dir>/usr/share/fonts/noto</dir>
	<dir>/usr/share/fonts/noto-cjk</dir>
	<dir>/usr/share/fonts/noto-color-emoji</dir>

	<selectfont>
		<rejectfont>
			<glob>/usr/share/fonts/noto/*</glob>
		</rejectfont>
		<acceptfont>
			<glob>/usr/share/fonts/noto/NotoSans-*</glob>
			<glob>/usr/share/fonts/noto/NotoSansMono-*</glob>
			<glob>/usr/share/fonts/noto/NotoSerif-*</glob>
			<glob>/usr/share/fonts/noto/NotoSansSymbols*</glob>
			<glob>/usr/share/fonts/noto/NotoSansMath-*</glob>
		</acceptfont>
	</selectfont>

	<include ignore_missing="yes">/etc/fonts/conf.d</include>

	<cachedir>/var/cache/fontconfig</cachedir>
	<cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
